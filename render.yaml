services:
  - type: web
    name: shivam-travels-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: http://localhost:5173
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: BACKEND_URL
        value: http://localhost:5000
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: 30
      - key: ADMIN_PUBLIC_PATH
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RATE_LIMIT_MAX
        value: 1000
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: MONGO_MAX_POOL_SIZE
        value: 20
      - key: MONGO_MIN_POOL_SIZE
        value: 2
